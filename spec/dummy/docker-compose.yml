services:
  strata-dummy-database:
    image: postgres:14-alpine
    command: postgres -c "log_lock_waits=on" -N 1000 -c "fsync=off"
    env_file: .env
    environment:
      POSTGRES_PASSWORD: secret123
      POSTGRES_USER: app
    healthcheck:
      test: "pg_isready --username=app"
      timeout: 10s
      retries: 20
    ports:
      - 5432:5432
    volumes:
      - demo-database_data:/var/lib/postgresql/data

volumes:
  demo-database_data:
